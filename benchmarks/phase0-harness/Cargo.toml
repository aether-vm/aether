[package]
name = "phase0-harness"
description = "Forkloom Phase 0 falsification suite (Linux only): F0-1..F0-8 kernel-primitive experiments."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "phase0_harness"
path = "src/lib.rs"

[[bin]]
name = "phase0-harness"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
getrandom.workspace = true
libc.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
aos-meta = { path = "../../crates/aos-meta" }
aos-types = { path = "../../crates/aos-types", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["user", "fs", "ioctl", "mount", "process", "signal"] }
