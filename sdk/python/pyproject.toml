[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forkloom-vm"
version = "0.1.0a0"
description = "Thin Python gRPC client for Forkloom stateful sandbox & VM forking runtime"
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.85.3",
    "protobuf>=7.35.1,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.85.3",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/forkloom-vm"
Repository = "https://github.com/forkloom-vm/forkloom"

[tool.hatch.build.targets.wheel]
packages = ["src/forkloom_vm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
