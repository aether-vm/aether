[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aether-vm"
version = "0.1.0a0"
description = "Thin Python gRPC client for Aether stateful sandbox & VM forking runtime"
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.68.0",
    "protobuf>=5.28.0",
]

[project.urls]
Homepage = "https://github.com/aether-vm"
Repository = "https://github.com/aether-vm/aether"
